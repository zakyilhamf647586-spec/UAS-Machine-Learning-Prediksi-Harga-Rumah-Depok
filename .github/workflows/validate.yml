name: Validate Depok ML

on:
  push:
    branches:
      - improve/validated-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check required project artifacts
        run: |
          test -f dataset/Cleaned_Final_Rumah.csv
          test -f models/house_price_pipeline.joblib
          test -f metrics.json

      - name: Validate Python syntax
        run: python -m compileall -q app.py train_model.py

      - name: Run automated tests
        run: python -m pytest tests/test_model.py -q
